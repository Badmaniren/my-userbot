name: Unga Arena

on:
  push:
    branches:
      - 'main'
      - 'unga-*'

jobs:
  arena-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run tests
        run: |
          python -m unittest discover -s . -p "test_*.py"
